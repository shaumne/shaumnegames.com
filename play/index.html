<style>body{margin:0;background:#0e1320;color:#e8ecf4;font:16px/1.6 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px;text-align:center}a{color:#46e0d0;font-weight:700}</style>
<script>
  // Ad landing link: Android -> Google Play, iPhone/iPad -> App Store (when live), everything else -> the home page.
  // No cookies, no tracking. utm_* parameters on this URL are passed on to Google Play as the install referrer.
  (function () {
    var PLAY = 'https://play.google.com/store/apps/details?id=com.shaumnegames.committofreedom';
    var APPLE_LIVE = false; // set true once the App Store version is released
    var APPLE = 'https://apps.apple.com/app/id6826895027';
    var ua = navigator.userAgent || '';
    var q = location.search.replace(/^\?/, '');
    var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var target = '/';
    if (/Android/i.test(ua)) {
      target = PLAY + (q ? '&referrer=' + encodeURIComponent(q) : '');
    } else if (isIOS && APPLE_LIVE) {
      target = APPLE;
    }
    location.replace(target);
  })();
</script>
</head>
